experiment_name: whu_cdmamba_maskcd
data:
  dataset: whu-cd
  root: D:/桌面/文献/论文/公开数据集/datasets
  image_size: 256
model:
  name: cdmamba_maskcd
  role: Mamba-driven object-level change reasoning
  encoder: CDMamba-style global-local feature enhancer
  decoder: MaskCD-dominant change-aware mask decoder
  fusion: 0.7 * object_mask_logits + 0.3 * auxiliary_pixel_logits
training:
  epochs: 100
  batch_size: 4
  lr: 0.0001
  scheduler: cosine
  metrics: [precision, recall, f1, iou, accuracy]
